// ============================================================
//  1. GLOBAL STATE & CONFIGURATION
// ============================================================
const App = {

  sessionToken: null,
  requests:     [],
  allUsers:     [], // เพื่อเก็บข้อมูลผู้ใช้ทั้งหมดสำหรับแอดมิน
  currentReq:   null,
  deleteTarget: null,
  filterStatus: "",
  filterDept:   "",
  searchQuery:  "",
  quickFilter:  "",

};

let dashboardTimer = null; // ตัวตั้งเวลาสำหรับระบบ Real-time Dashboard

// ============================================================
//  2. GOOGLE SCRIPT BRIDGE (BACKEND LINK)
// ============================================================
const GS = {
  call(fn, ...args) {
    return new Promise((resolve) => {
      if (typeof google !== "undefined" && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(err => resolve({ success: false, message: err.message }))
          [fn](...args, ...(fn === "login" ? [] : [App.sessionToken]));
      } else {
        // Fallback สำหรับใช้งานตรวจสอบรีวิวบนคอมพิวเตอร์ (Mock Data)
        resolve(MockData[fn](...args));
      }
    });
  }
};

// ============================================================
//  3. MOCK DATA ENGINE (สำหรับจำลองระบบ)
// ============================================================
const MOCK_REQUESTS = [
  { id:"1", requestNo:"REQ250523-0001", requesterName:"กิตติศักดิ์ ศรีราศรี", requesterEmail:"doctor01@hospital.go.th", department:"อายุรกรรม", reportType:"รายงานผู้ป่วยนอก (OPD)", dateFrom:"2026-05-23T00:00:00.000Z", dateTo:"2026-05-24T00:00:00.000Z", purpose:"ดึงรายงาน", urgency:"ปกติ", status:"รอดำเนินการ", adminNote:"", createdAt:"2026-06-01T09:00:00Z", updatedAt:"2026-06-01T09:00:00Z", createdBy:"doctor01", downloadUrl:"" }
];

const MOCK_USERS = [
  { username:"admin", password:"admin1234", displayName:"ผู้ดูแลระบบ", email:"admin@hospital.go.th", role:"admin", department:"สารสนเทศ", lineId:"", telegramId:"" },
  { username:"doctor01", password:"doc1234", displayName:"กิตติศักดิ์ ศรีราศรี", email:"doctor01@hospital.go.th", role:"doctor", department:"อายุรกรรม", lineId:"", telegramId:"" }
];

const MockData = {
  login(username, password) {
    const u = MOCK_USERS.find(x => String(x.username).trim() === String(username).trim() && String(x.password).trim() === String(password).trim());
    if (u) return { success: true, user: u };

  },
  getRequests() { return { success: true, data: MOCK_REQUESTS }; },
  getDashboardStats() {
    return { success: true, data: {
      total: MOCK_REQUESTS.length,
      pending: MOCK_REQUESTS.filter(r=>r.status==="รอดำเนินการ").length,
      processing: MOCK_REQUESTS.filter(r=>r.status==="กำลังดำเนินการ").length,
      completed: MOCK_REQUESTS.filter(r=>r.status==="เสร็จสิ้น").length,
      rejected: MOCK_REQUESTS.filter(r=>r.status==="ปฏิเสธ").length,
      inboxCount: MOCK_REQUESTS.filter(r=>r.status==="เสร็จสิ้น" && r.downloadUrl).length,
      recent: MOCK_REQUESTS.slice(-5).reverse()
    }};
  },
  createRequest(payload, username) {
    const id = "mock-" + Date.now();
    const requestNo = "REQ" + Date.now().toString().slice(-6);
    MOCK_REQUESTS.push({ id, requestNo, ...payload, status:"รอดำเนินการ", adminNote:"", createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(), createdBy:username, downloadUrl:"" });
    return { success: true, id, requestNo };
  },
  updateRequest(id, payload) {
    const idx = MOCK_REQUESTS.findIndex(r=>r.id==id);
    if (idx >= 0) Object.assign(MOCK_REQUESTS[idx], payload, { updatedAt: new Date().toISOString() });
    return { success: true };
  },
  deleteRequest(id) {
    const idx = MOCK_REQUESTS.findIndex(r=>r.id==id);
    if (idx >= 0) MOCK_REQUESTS.splice(idx, 1);
    return { success: true };
  },
  getUsers() { return { success: true, data: MOCK_USERS }; },
  saveUser(payload) {
    const idx = MOCK_USERS.findIndex(x => String(x.username).trim() === String(payload.username).trim());
    if (idx >= 0) Object.assign(MOCK_USERS[idx], payload);
    else MOCK_USERS.push(payload);
    return { success: true };
  },
  deleteUser(username) {
    const idx = MOCK_USERS.findIndex(x => String(x.username).trim() === String(username).trim());
    if (idx >= 0) MOCK_USERS.splice(idx, 1);
    return { success: true };
  },
  testLineNotification(targetId) { return { success: true, message: "ส่งข้อความทดสอบเข้า LINE เรียบร้อยแล้ว (ID: " + (targetId || "แอดมินกลุ่ม") + ")" }; },
  sendReportEmail() { return { success: true }; },
  getMonthlyReport() { return { success: true, data: MOCK_REQUESTS }; },
  updateProfile(username, payload) {

  uploadFileToDrive(base64Data, fileName, mimeType) {

    };

};

function toast(msg, type="info") {
  const c = document.getElementById("toast-container");
  if (!c) return;
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  const icons = { success:"✅", error:"❌", info:"ℹ️" };
  el.innerHTML = `<span>${icons[type]||"ℹ️"}</span><span>${msg}</span>`;
  c.appendChild(el);
  setTimeout(() => { 
    el.style.opacity="0"; el.style.transform="translateX(20px)"; el.style.transition="all .3s"; 
    setTimeout(()=>el.remove(), 300); 
  }, 3000);
}

function openModal(id) { const el = document.getElementById(id); if (el) el.classList.add("open"); }
function closeModal(id) { const el = document.getElementById(id); if (el) el.classList.remove("open"); }

function statusBadge(s) {
  const map = { "รอดำเนินการ":"badge-pending","กำลังดำเนินการ":"badge-process","เสร็จสิ้น":"badge-done","ปฏิเสธ":"badge-rejected" };
  return `<span class="badge ${map[s]||'badge-normal'}">${s}</span>`;
}
function urgencyBadge(u) {
  const map = { "ด่วนที่สุด":"badge-urgent", "เร่งด่วน":"badge-urgent", "สูง":"badge-high", "ปกติ":"badge-normal" };
  return `<span class="badge ${map[u]||'badge-normal'}">${u}</span>`;
}

function isMine(r) {
  return r.createdBy === App.user?.displayName || String(r.createdBy || "").trim() === String(App.user?.username || "").trim() || r.requesterName === App.user?.displayName;
}

function isOverdue(r) {
  return r.neededDate && !["เสร็จสิ้น", "ปฏิเสธ"].includes(r.status) && new Date(r.neededDate + "T23:59:59") < new Date();
}

function urgencyRank(u) { return ({ "ด่วนที่สุด":3, "เร่งด่วน":3, "สูง":2, "ปกติ":1 })[u] || 0; }

function addNotification(title, body) {
  App.notifications.unshift({ title, body, time: new Date().toISOString() });
  App.notifications = App.notifications.slice(0, 20);
  renderNotifications();
}

function renderNotifications() {
  const list = document.getElementById("notification-list");
  const count = document.getElementById("notification-count");
  if (count) { count.textContent = App.notifications.length; count.style.display = App.notifications.length ? "block" : "none"; }
  if (!list) return;
  list.innerHTML = App.notifications.length ? App.notifications.map(n => `<div class="notification-item"><span>🔔</span><div><strong>${n.title}</strong><p>${n.body} · ${formatThaiDate(n.time)}</p></div></div>`).join("") : `<div class="empty-state"><div class="empty-icon">🔕</div><p>ยังไม่มีการแจ้งเตือนใหม่</p></div>`;
}

function saveRequestPreferences() {

}

function restoreRequestPreferences() {
  try {
    const p = JSON.parse(localStorage.getItem("hosxp_request_preferences") || "{}");
    App.quickFilter = p.quickFilter || "";
    App.sortRequests = p.sortRequests || "created-desc";
    const sort = document.getElementById("sort-requests");

}

async function copyTicketId(ticketId) {

    await navigator.clipboard.writeText(ticketId);
    toast("คัดลอก Ticket ID แล้ว", "success");
  } catch (e) {
    toast("ไม่สามารถคัดลอก Ticket ID ได้", "error");
  }
}
function formatDate(iso) {
  if (!iso) return "-";
  try { return new Date(iso).toLocaleDateString("th-TH", { year:"numeric", month:"short", day:"numeric" }); } catch { return iso; }
}

function formatThaiDate(d) {
  if (!d) return "-";
  try {
    const dateObj = new Date(d);
    if (isNaN(dateObj.getTime())) {
      const parts = d.split("T")[0].split("-");
      if (parts.length === 3) {
        const [y, m, dd] = parts;
        const months = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
        return `${parseInt(dd)} ${months[parseInt(m)-1]} ${parseInt(y)+543}`;
      }
      return d;
    }
    const dd = dateObj.getDate();
    const m = dateObj.getMonth();
    const y = dateObj.getFullYear();
    const months = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
    return `${dd} ${months[m]} ${y + 543}`;
  } catch (e) { return d; }
}

function statusColor(s) {
  return { "รอดำเนินการ":"#f9ab00","กำลังดำเนินการ":"#4285f4","เสร็จสิ้น":"#1e8e3e","ปฏิเสธ":"#d93025" }[s]||"#9aa0a6";
}

// ============================================================
//  5. AUTHENTICATION (SYSTEM LOGIN / LOGOUT)
// ============================================================
async function doLogin() {
  const errEl = document.getElementById("login-error");
  if (errEl) errEl.style.display = "none";

  const uEl = document.getElementById("login-username");
  const pEl = document.getElementById("login-password");
  if (!uEl || !pEl) return;

  const u = uEl.value.trim();
  const p = pEl.value.trim();

  if (!u || !p) {
    showLoginError("กรุณากรอกชื่อผู้ใช้และรหัสผ่าน");
    return;
  }

  const btnText = document.getElementById("login-btn-text");
  const btn = document.getElementById("login-btn");
  if (btnText && btn) {
    btn.disabled = true;
    btnText.textContent = "กำลังเข้าสู่ระบบ...";
  }

  try {
    const res = await GS.call("login", u, p);
    if (res.success) {
      App.user = res.user;
      App.sessionToken = res.sessionToken || null;
      const rem = document.getElementById("login-remember");
      if (rem && rem.checked) {
        localStorage.setItem("hosxp_username", u);
      } else {
        localStorage.removeItem("hosxp_username");
      }
      localStorage.removeItem("hosxp_password");
      
      startApp();
    } else {
      showLoginError(res.message);
    }
  } catch (e) {
    showLoginError("เกิดข้อผิดพลาดในการเชื่อมต่อ: " + e.message);
  } finally {
    if (btnText && btn) {
      btn.disabled = false;
      btnText.textContent = "เข้าสู่ระบบ";
    }
  }
}

function showLoginError(msg) {
  const el = document.getElementById("login-error");
  if (el) { el.textContent = "⚠️ " + msg; el.style.display = "block"; }
}

function logout() {
  App.user = null; App.sessionToken = null; App.requests = [];
  clearInterval(dashboardTimer);
  
  // รีเซ็ตแผงประวัติการคุยและการแสดงผลของ AI
  const chatPanel = document.getElementById("ai-chat-panel");
  if (chatPanel) chatPanel.style.display = "none";
  
  // ซ่อนวิดเจ็ต AI หลัก
  const chatWidget = document.getElementById("ai-chat-widget");
  if (chatWidget) chatWidget.style.display = "none";
  
  aiChatHistory = [
    { role: "model", text: "มีข้อสงสัยเกี่ยวกับตารางข้อมูล HOSxP หรือตัวอย่างคำสั่ง SQL ดึงข้อมูลหรือไม่? สอบถามผมได้เลยครับ!" }
  ];

  }
  
  document.getElementById("app-shell").style.display = "none";
  document.getElementById("login-screen").style.display = "flex";

// ============================================================
//  6. APP INITIALIZATION & NAVIGATION

function startApp() {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app-shell").style.display = "block";

  const u = App.user;
  const isAdmin = u.role === "admin";

  document.getElementById("sidebar-username").textContent = u.displayName;
  document.getElementById("sidebar-role").innerHTML = (isAdmin ? "ผู้ดูแลระบบ (IT)" : `เจ้าหน้าที่ ${u.department}`) + ' <span style="font-size: 10px; opacity: 0.7;">IT</span>';
  document.getElementById("user-avatar").textContent = isAdmin ? "🛡️" : "👤";

  document.querySelectorAll(".admin-only").forEach(el => el.style.display = isAdmin ? "block" : "none");
  if (document.getElementById("ed-status-grp")) document.getElementById("ed-status-grp").style.display = isAdmin ? "block" : "none";
  if (document.getElementById("ed-note-grp")) document.getElementById("ed-note-grp").style.display = isAdmin ? "block" : "none";

  if (document.getElementById("nr-name")) document.getElementById("nr-name").value = u.displayName;
  if (document.getElementById("nr-email")) document.getElementById("nr-email").value = u.email;
  const deptSel = document.getElementById("nr-dept");
  if (deptSel) {
    for (const opt of deptSel.options) { if (opt.value === u.department) { opt.selected = true; break; } }
  }

  // แสดง AI Chat Widget
  const chatWidget = document.getElementById("ai-chat-widget");
  if (chatWidget) chatWidget.style.display = "block";

  // อัปเดต Role Badge ใน Chat
  const roleBadge = document.getElementById("ai-chat-role");
  if (roleBadge) {
    roleBadge.textContent = isAdmin ? "Admin (SQL Mode)" : "Medical Staff (Helper)";
    roleBadge.style.background = isAdmin ? "rgba(255, 255, 255, 0.25)" : "rgba(255, 255, 255, 0.15)";
  }

  // กำหนดข้อความต้อนรับและประวัติการคุยตามบทบาทผู้ใช้
  const welcomeText = isAdmin 
    ? "สวัสดีครับแอดมิน! ผมพร้อมช่วยวิเคราะห์ตาราง HOSxP และร่าง SQL ให้คุณแล้ว ต้องการดึงข้อมูลส่วนไหนบอกได้เลยครับ" 
    : "สวัสดีครับ! ผมคือผู้ช่วย AI ยินดีให้คำแนะนำเกี่ยวกับการขอรายงานข้อมูล หากคุณไม่แน่ใจว่าต้องระบุข้อมูลอะไร สอบถามผมได้เลยครับ";
  aiChatHistory = [{ role: "model", text: welcomeText }];
  const chatMsgs = document.getElementById("ai-chat-messages");
  if (chatMsgs) {
    chatMsgs.innerHTML = `<div class="chat-message model">${welcomeText}</div>`;
  }

  navigate("dashboard");
}

function navigate(page) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
  
  const pg = document.getElementById("page-" + page);
  if (pg) pg.classList.add("active");
  const nav = document.querySelector(`[data-page="${page}"]`);
  if (nav) nav.classList.add("active");
  
  const titles = { dashboard:"แดชบอร์ด", requests:"คำขอรายงาน", inbox:"กล่องรับเข้าไฟล์", "new-request":"สร้างคำขอใหม่", logs:"บันทึกกิจกรรม", users:"จัดการผู้ใช้", settings:"จัดการโปรไฟล์ส่วนตัว" };
  document.getElementById("page-title").textContent = titles[page] || page;
  
  clearInterval(dashboardTimer);
  if (page === "dashboard") {
    loadDashboard();
    dashboardTimer = setInterval(() => {
      if (document.getElementById("page-dashboard").classList.contains("active")) {
        loadDashboard();
      }
    }, 30000);
  }
  if (page === "requests") loadRequests();
  if (page === "inbox") loadInbox();
  if (page === "logs") loadLogs();
  if (page === "users") loadUsers();
  if (page === "settings") loadSettings();
}

// --- PROFILE / SETTINGS ENGINE ---------------------------
function loadSettings() {
  const u = App.user;
  if (!u) return;
  document.getElementById("set-username").value = u.username || "";
  document.getElementById("set-password").value = u.password || "";
  document.getElementById("set-display").value = u.displayName || "";
  document.getElementById("set-dept").value = u.department || "";
  document.getElementById("set-email").value = u.email || "";
  document.getElementById("set-lineid").value = u.lineId || "";
  document.getElementById("set-telegramid").value = u.telegramId || "";
}

async function saveSettings() {
  const payload = {
    password:    document.getElementById("set-password").value,
    displayName: document.getElementById("set-display").value.trim(),
    email:       document.getElementById("set-email").value.trim(),
    department:  document.getElementById("set-dept").value.trim(),
    lineId:      document.getElementById("set-lineid").value.trim(),
    telegramId:  document.getElementById("set-telegramid").value.trim()
  };
  
  if (!payload.displayName) { toast("กรุณากรอกชื่อที่แสดง", "error"); return; }
  
  const btn = document.getElementById("set-save-btn");
  if (btn) { btn.disabled = true; btn.textContent = "กำลังบันทึก..."; }
  
  const res = await GS.call("updateProfile", App.user.username, payload);
  
  if (btn) { btn.disabled = false; btn.textContent = "💾 บันทึกตั้งค่า"; }
  
  if (res.success) {
    // อัปเดตข้อมูลใน App.user ด้วย
    if (payload.password) App.user.password = payload.password;
    App.user.displayName = payload.displayName;
    App.user.email = payload.email;
    App.user.department = payload.department;
    App.user.lineId = payload.lineId;
    App.user.telegramId = payload.telegramId;
    
    document.getElementById("sidebar-username").textContent = App.user.displayName;
    document.getElementById("sidebar-role").innerHTML = (App.user.role === "admin" ? "ผู้ดูแลระบบ (IT)" : `เจ้าหน้าที่ ${App.user.department}`) + ' <span style="font-size: 10px; opacity: 0.7;">IT</span>';
    document.getElementById("set-password").value = "";
    toast("บันทึกข้อมูลส่วนตัวและตั้งค่าการแจ้งเตือนสำเร็จ", "success");
  } else {
    toast(res.message || "เกิดข้อผิดพลาดในการบันทึก", "error");
  }
}

async function testPersonalLine() {
  const lineId = document.getElementById("set-lineid").value.trim();

  if (res.success) {
    toast(res.message, "success");
  } else {
    toast(res.message || "เกิดข้อผิดพลาดในการทดสอบ LINE", "error");
  }
}

async function testPersonalTelegram() {

    toast(res.message || "เกิดข้อผิดพลาดในการทดสอบ Telegram", "error");
  }
}

let dashboardFilter = "";
let urgencyChartInstance = null;
let departmentChartInstance = null;

async function loadDashboard() {
  const res = await GS.call("getDashboardStats", App.user.username, App.user.role, App.user.displayName);
  if (!res.success) return;
  const d = res.data;
  
  document.getElementById("stat-total").textContent      = d.total;
  document.getElementById("stat-pending").textContent    = d.pending;
  document.getElementById("stat-processing").textContent = d.processing;
  document.getElementById("stat-done").textContent       = d.completed;
  document.getElementById("stat-rejected").textContent   = d.rejected;

  const total = d.total || 1;
  const segs = document.querySelectorAll("#progress-bar .progress-seg");
  const vals = [d.pending, d.processing, d.completed, d.rejected];
  segs.forEach((s, i) => { s.style.width = ((vals[i]/total)*100).toFixed(1) + "%"; });

  // อัปเดตสถานะการกรองบน UI
  const filterInfo = document.getElementById("dashboard-filter-info");
  const currentFilterText = document.getElementById("current-dashboard-filter");
  if (dashboardFilter) {
    if (filterInfo) filterInfo.style.display = "block";
    if (currentFilterText) currentFilterText.textContent = dashboardFilter;
  } else {
    if (filterInfo) filterInfo.style.display = "none";
  }

  // ไฮไลท์ Card ที่เลือก
  document.querySelectorAll(".stat-card").forEach(c => {
    if (c.dataset.filter === dashboardFilter) c.classList.add("selected");
    else c.classList.remove("selected");
  });

  // อัปเดตตัวเลข Sidebar Badge
  const badge = document.getElementById("nav-badge-pending");
  if (badge) {
    if (d.pending > 0) {
      badge.textContent = d.pending;
      badge.style.display = "inline-block";
    } else {
      badge.style.display = "none";
    }
  }

  // อัปเดตตัวเลข Sidebar Badge สำหรับ Inbox
  const inboxBadge = document.getElementById("nav-badge-inbox");
  if (inboxBadge) {
    if (d.inboxCount > 0) {
      inboxBadge.textContent = d.inboxCount;
      inboxBadge.style.display = "inline-block";
    } else {
      inboxBadge.style.display = "none";
    }
  }

  // ตรวจจับคำขอใหม่และแจ้งเตือน In-App
  if (App.user && App.user.role === "admin") {
    if (App.lastPendingCount !== -1 && d.pending > App.lastPendingCount) {
      playNotificationSound();
      toast("🔔 มีคำขอรายงานใหม่เข้าระบบ!", "info");
      addNotification("มีคำขอรายงานใหม่", `ขณะนี้มี ${d.pending} รายการรอดำเนินการ`);
    }
    App.lastPendingCount = d.pending;
  }

  const list = document.getElementById("recent-list");
  let displayRecent = d.recent;
  if (dashboardFilter) {
    displayRecent = displayRecent.filter(r => r.status === dashboardFilter);
  }

  if (!displayRecent || displayRecent.length === 0) {
    list.innerHTML = `<div class="empty-state">ไม่พบรายการที่มีสถานะ "${dashboardFilter || 'ทั้งหมด'}" ใน 10 รายการล่าสุด</div>`;
    return;
  }
  
  list.innerHTML = displayRecent.map(r => {
    const isOwner = (r.createdBy === App.user.displayName || String(r.createdBy).trim() === String(App.user.username).trim());
    const ownerBadge = isOwner ? '<b style="color:#e37400;"> [คำขอของฉัน]</b>' : '';
    return `
    <div class="recent-item" onclick="showDetail('${r.id}')">
      <div class="recent-dot" style="background:${statusColor(r.status)}"></div>
      <div class="recent-info">
        <div class="recent-no">${r.requestNo}${ownerBadge}</div>
        <div class="recent-name">${r.requesterName} — ${r.reportType}</div>
      </div>
      <div class="recent-time">${formatThaiDate(r.createdAt)}</div>
      ${statusBadge(r.status)}
    </div>`;
  }).join("");

  renderActionQueue(App.requests.length ? App.requests : (d.recent || []));
  renderInteractiveCharts(d.urgency, d.depts);
}

function renderInteractiveCharts(urgencyData, deptData) {
  // 1. Urgency Chart (Doughnut Chart)
  const ctxUrgency = document.getElementById("urgencyChart")?.getContext("2d");
  if (ctxUrgency) {
    if (urgencyChartInstance) urgencyChartInstance.destroy();
    
    const labels = Object.keys(urgencyData || {});
    const counts = Object.values(urgencyData || {});
    
    urgencyChartInstance = new Chart(ctxUrgency, {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: counts,
          backgroundColor: [
            '#2FB67E', // ปกติ - เขียว
            '#F3B34C', // สูง - ส้ม
            '#DE5D4E', // ด่วนที่สุด - แดง
            '#9c27b0', // สีอื่น
            '#3f51b5'
          ],
          borderWidth: 2,
          borderColor: '#ffffff'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'bottom',
            labels: {
              boxWidth: 12,
              font: { family: 'Sarabun, sans-serif', size: 11 }
            }
          }
        }
      }
    });
  }

  // 2. Department Chart (Horizontal/Vertical Bar Chart)
  const ctxDept = document.getElementById("departmentChart")?.getContext("2d");
  if (ctxDept) {
    if (departmentChartInstance) departmentChartInstance.destroy();

    const labels = (deptData || []).map(item => item.name);
    const counts = (deptData || []).map(item => item.count);

    departmentChartInstance = new Chart(ctxDept, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: 'จำนวนคำขอ',
          data: counts,
          backgroundColor: 'rgba(13, 148, 136, 0.75)', // Primary teal color
          hoverBackgroundColor: 'rgba(13, 148, 136, 0.95)',
          borderRadius: 6,
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: false
          }
        },
        scales: {
          x: {
            grid: { display: false },
            ticks: { font: { family: 'Sarabun, sans-serif', size: 10 } }
          },
          y: {
            beginAtZero: true,
            ticks: {
              stepSize: 1,
              font: { family: 'Sarabun, sans-serif', size: 10 }
            }
          }
        }
      }
    });
  }
}

function renderActionQueue(source) {
  const el = document.getElementById("action-queue");
  if (!el) return;
  const rows = source.filter(r => !["เสร็จสิ้น", "ปฏิเสธ"].includes(r.status)).sort((a, b) => {
    const urgency = urgencyRank(b.urgency) - urgencyRank(a.urgency);
    if (urgency) return urgency;
    return new Date(a.neededDate || "2999-12-31") - new Date(b.neededDate || "2999-12-31");
  }).slice(0, 5);
  el.innerHTML = rows.length ? rows.map(r => `<div class="queue-item" onclick="showDetail('${r.id}')"><div class="recent-dot" style="background:${isOverdue(r) ? 'var(--red)' : statusColor(r.status)}"></div><div class="queue-main"><div class="queue-title">${r.requestNo} · ${r.reportType}</div><div class="queue-meta">${r.department || '-'} · <span class="${isOverdue(r) ? 'due-overdue' : ''}">${isOverdue(r) ? 'เกินกำหนด' : 'ต้องการรับ ' + formatThaiDate(r.neededDate)}</span></div></div>${urgencyBadge(r.urgency)}</div>`).join("") : `<div class="empty-state"><p>ไม่มีงานที่กำลังรอดำเนินการ</p></div>`;
}

async function loadRequests() {
  const res = await GS.call("getRequests", App.user.username, App.user.role, App.user.displayName);
  if (res && res.success) { App.requests = res.data; renderTable(); renderActionQueue(App.requests); }

function renderTable() {
  const isAdmin = App.user.role === "admin";
  const tbody = document.getElementById("requests-tbody");
  if (!tbody) return;

  let rows = App.requests.filter(r => {
    const qs = App.searchQuery.toLowerCase();
    const matchSearch = !qs || [r.requestNo, r.requesterName, r.department, r.reportType].some(v => (v || "").toLowerCase().includes(qs));
    const matchStatus = !App.filterStatus || r.status === App.filterStatus;
    const matchDept = !App.filterDept || r.department === App.filterDept;
    const matchQuick = !App.quickFilter || (App.quickFilter === "mine" && isMine(r)) || (App.quickFilter === "pending" && r.status === "รอดำเนินการ") || (App.quickFilter === "urgent" && urgencyRank(r.urgency) >= 3) || (App.quickFilter === "overdue" && isOverdue(r));
    return matchSearch && matchStatus && matchDept && matchQuick;
  });

  rows.sort((a, b) => {
    if (App.sortRequests === "needed-asc") return new Date(a.neededDate || "2999-12-31") - new Date(b.neededDate || "2999-12-31");
    if (App.sortRequests === "urgency-desc") return urgencyRank(b.urgency) - urgencyRank(a.urgency) || new Date(b.createdAt) - new Date(a.createdAt);
    return new Date(b.createdAt) - new Date(a.createdAt);
  });

  document.querySelectorAll(".quick-filter").forEach(b => b.classList.toggle("active", b.dataset.quickFilter === App.quickFilter));
  const pageSize = 10;
  const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
  App.requestPage = Math.min(App.requestPage, totalPages);
  const pageRows = rows.slice((App.requestPage - 1) * pageSize, App.requestPage * pageSize);

  if (rows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state">ไม่พบรายการคิวคำขอ</div></td></tr>`;
    const pager = document.getElementById("table-pagination");
    if (pager) pager.innerHTML = "";
    return;
  }

  tbody.innerHTML = pageRows.map(r => {
    const isOwner = isMine(r);
    const canEdit = isAdmin || (isOwner && r.status === "รอดำเนินการ");
    const canDelete = isAdmin || (isOwner && r.status === "รอดำเนินการ");
    
    const rowBgStyle = isOwner ? 'style="background-color: #fffde7;"' : '';
    const ownerBadge = isOwner ? '<span style="color:#e37400; font-weight:bold; font-size:11px; display:block;">📝 คำขอของฉัน</span>' : '';

    return `
    <tr ${rowBgStyle} onclick="showDetail('${r.id}')">
      <td><span class="req-no">${r.requestNo}</span>${ownerBadge}</td>
      <td>${r.requesterName}</td>
      <td>${r.department}</td>
      <td>${r.reportType}</td>
      <td>${urgencyBadge(r.urgency)}</td>
      <td>${statusBadge(r.status)}</td>
      <td>${formatDate(r.createdAt)}</td>
      <td onclick="event.stopPropagation()">
        <div class="td-actions">
          <button class="btn btn-sm btn-secondary btn-icon" title="ดู" onclick="showDetail('${r.id}')">👁️</button>
          ${canEdit ? `<button class="btn btn-sm btn-secondary btn-icon" title="แก้ไข" onclick="openEditModal('${r.id}')">✏️</button>` : ''}
          ${r.downloadUrl ? `<a href="${r.downloadUrl}" target="_blank" class="btn btn-sm btn-secondary btn-icon" title="ดาวน์โหลดไฟล์รายงาน" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center;" onclick="writeLogDownload('${r.requestNo}')">📥</a>` : ''}
          <button class="btn btn-sm btn-secondary btn-icon" title="PDF" onclick="openPdfModal('${r.id}')">📄</button>
          ${canDelete ? `<button class="btn btn-sm btn-danger btn-icon" title="ลบ" onclick="confirmDelete('${r.id}')">🗑️</button>` : ""}
        </div>
      </td>
    </tr>`;
  }).join("");
  const pager = document.getElementById("table-pagination");
  if (pager) pager.innerHTML = rows.length > pageSize ? `<span>หน้า ${App.requestPage} / ${totalPages} · ${rows.length} รายการ</span><button class="btn btn-secondary btn-sm" ${App.requestPage === 1 ? "disabled" : ""} onclick="changeRequestPage(-1)">ก่อนหน้า</button><button class="btn btn-secondary btn-sm" ${App.requestPage === totalPages ? "disabled" : ""} onclick="changeRequestPage(1)">ถัดไป</button>` : rows.length ? `<span>${rows.length} รายการ</span>` : "";
}

// อัปเดตสเต็ป step-indicator เมื่อกรอกข้อมูลสมบูรณ์
function updateFormStepsProgress() {
  const step1 = document.getElementById('step1-indicator');
  const step2 = document.getElementById('step2-indicator');
  const step3 = document.getElementById('step3-indicator');

  const nameVal = document.getElementById('nr-name')?.value.trim();
  const emailVal = document.getElementById('nr-email')?.value.trim();
  const deptVal = document.getElementById('nr-dept')?.value;

  const typeVal = document.getElementById('nr-type')?.value.trim();
  const purposeVal = document.getElementById('nr-purpose')?.value.trim();
  const fromVal = document.getElementById('nr-from')?.value;
  const toVal = document.getElementById('nr-to')?.value;

  // Step 1: ข้อมูลผู้ขอ
  if (nameVal && emailVal && deptVal) {
    if (step1) step1.className = 'step-item active';
  } else {
    if (step1) step1.className = 'step-item';
  }

  // Step 2: รายละเอียดรายงาน
  if (typeVal && purposeVal && fromVal && toVal) {
    if (step2) step2.className = 'step-item active';
  } else {
    if (step2) step2.className = 'step-item';
  }

  // Step 3: ส่งคำขอ
  if (selectedFormPriority) {
    if (step3) step3.className = 'step-item active';
  } else {
    if (step3) step3.className = 'step-item';
  }
}

let detailDragDropInitialized = false;

function initDetailDragAndDrop() {
  if (detailDragDropInitialized) return;
  detailDragDropInitialized = true;
  
  const dropzone = document.getElementById("detail-upload-dropzone");
  const fileInput = document.getElementById("detail-upload-file-input");
  
  if (!dropzone || !fileInput) return;
  
  // Click dropzone to trigger file input
  dropzone.addEventListener("click", () => fileInput.click());
  
  // File input change
  fileInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) handleDetailFileUpload(file);
  });
  
  // Drag over
  dropzone.addEventListener("dragover", (e) => {
    e.preventDefault();
    e.stopPropagation();
    dropzone.classList.add("drag-over");
  });
  
  // Drag leave
  dropzone.addEventListener("dragleave", (e) => {
    e.preventDefault();
    e.stopPropagation();
    dropzone.classList.remove("drag-over");
  });
  
  // Drop
  dropzone.addEventListener("drop", (e) => {
    e.preventDefault();
    e.stopPropagation();
    dropzone.classList.remove("drag-over");
    
    const file = e.dataTransfer.files[0];
    if (file) handleDetailFileUpload(file);
  });
}

async function handleDetailFileUpload(file) {
  if (!file) return;
  
  // จำกัดขนาดไฟล์ไม่เกิน 25 MB
  if (file.size > 25 * 1024 * 1024) {
    toast("ขนาดไฟล์ใหญ่เกินไป (จำกัดไม่เกิน 25MB)", "error");
    return;
  }
  
  const statusWrap = document.getElementById("detail-upload-status");
  const statusText = document.getElementById("detail-upload-status-text");
  const percentText = document.getElementById("detail-upload-percent");
  const progressBar = document.getElementById("detail-upload-progress-bar");
  
  if (statusWrap && statusText && percentText && progressBar) {
    statusWrap.style.display = "block";
    statusText.style.color = "var(--blue)";
    statusText.textContent = `⏳ กำลังอ่านไฟล์: ${file.name}...`;
    percentText.textContent = "0%";
    progressBar.style.width = "0%";
  }
  
  const reader = new FileReader();
  reader.onload = async function(e) {
    if (statusText) statusText.textContent = `📤 กำลังอัปโหลดไฟล์ไปที่ Google Drive...`;
    if (progressBar) progressBar.style.width = "40%";
    if (percentText) percentText.textContent = "40%";

        'jpeg': 'image/jpeg',
        'gif': 'image/gif',
        'zip': 'application/zip',
        'txt': 'text/plain'
      };
      mimeType = mimeTypes[ext] || 'application/octet-stream';

        statusText.style.color = "var(--red)";
        statusText.textContent = `❌ อัปโหลดล้มเหลว: ${uploadRes.message}`;
      }
      toast("อัปโหลดล้มเหลว: " + uploadRes.message, "error");
    }
  };
  
  reader.onerror = function() {
    if (statusText) {

function renderAiMarkdown(text) {
  if (!text) return "";
  
  // ป้องกัน XSS
  let escaped = text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

  // แปลง Code block
  escaped = escaped.replace(/```(?:sql|mysql|postgresql)?([\s\S]*?)```/g, (match, codeText) => {
    const trimmedCode = codeText.trim();
    return `<pre><code>${trimmedCode}</code><button class="ai-copy-btn" onclick="copySqlToClipboard(this)">📋 คัดลอก SQL</button></pre>`;
  });

  // แปลงตัวหนา
  escaped = escaped.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");

  // แปลง Inline code
  escaped = escaped.replace(/`(.*?)`/g, '<code style="background:var(--gray-200); padding:2px 6px; border-radius:4px; font-family:monospace; font-size:13px; font-weight:bold; color:var(--primary-dark);">$1</code>');

  // จัดการ Newlines
  const parts = escaped.split(/(<pre>[\s\S]*?<\/pre>)/);
  for (let i = 0; i < parts.length; i++) {
    if (!parts[i].startsWith("<pre>")) {
      parts[i] = parts[i].replace(/\n/g, "<br>");
    }
  }
  return parts.join("");
}

function copySqlToClipboard(btn) {
  const pre = btn.parentElement;
  const code = pre.querySelector("code");
  if (!code) return;

  const text = code.innerText || code.textContent;
  navigator.clipboard.writeText(text).then(() => {
    const originalText = btn.innerHTML;
    btn.innerHTML = "✅ คัดลอกสำเร็จ!";
    toast("คัดลอก SQL Query เรียบร้อยแล้ว", "success");
    setTimeout(() => {
      btn.innerHTML = originalText;
    }, 2000);
  }).catch(err => {
    toast("ไม่สามารถคัดลอกรหัสได้: " + err, "error");
  });
}

function validateNewRequest(payload) {
  
  if (!payload.requesterName) { toast("กรุณากรอกชื่อผู้ขอ", "error"); return false; }
  if (!payload.department) { toast("กรุณาเลือกแผนก/ฝ่าย", "error"); return false; }
  if (!payload.requesterEmail) { toast("กรุณากรอกอีเมล", "error"); return false; }
  if (!payload.reportType) { toast("กรุณากรอกชื่อรายงาน / หัวข้อ", "error"); return false; }
  if (!payload.purpose) { toast("กรุณากรอกวัตถุประสงค์การใช้งาน", "error"); return false; }
  if (!payload.dateFrom || !payload.dateTo) { toast("กรุณากรอกช่วงวันที่ข้อมูลให้ครบ", "error"); return false; }

  const from = new Date(payload.dateFrom);
  const to = new Date(payload.dateTo);
  if (from > to) { toast("วันที่เริ่มต้นต้องไม่เกินวันที่สิ้นสุด", "error"); return false; }
  return true;
}

let currentEditUsername = ""; 

function openUserModal(data = null) {
  const isEdit = !!data;
  currentEditUsername = isEdit ? data.username : "";
  document.getElementById("user-modal-title").textContent = isEdit ? "แก้ไขข้อมูลผู้ใช้" : "เพิ่มผู้ใช้ใหม่";
  
  const uName = document.getElementById("u-username");
  if (uName) {
    uName.value = isEdit ? data.username : "";
    uName.disabled = isEdit; // แก้ไขไม่ได้ถ้าเป็นการแก้ข้อมูลเดิม
    uName.style.background = isEdit ? "#f1f3f4" : "";
  }
  
  if (document.getElementById("u-password"))   document.getElementById("u-password").value = isEdit ? data.password : "";
  if (document.getElementById("u-display"))    document.getElementById("u-display").value = isEdit ? data.displayName : "";
  if (document.getElementById("u-email"))      document.getElementById("u-email").value = isEdit ? data.email : "";
  if (document.getElementById("u-lineid"))     document.getElementById("u-lineid").value = isEdit ? (data.lineId || "") : "";
  if (document.getElementById("u-telegramid")) document.getElementById("u-telegramid").value = isEdit ? (data.telegramId || "") : "";
  if (document.getElementById("u-role"))       document.getElementById("u-role").value = isEdit ? data.role : "doctor";
  if (document.getElementById("u-dept"))       document.getElementById("u-dept").value = isEdit ? data.department : "";
  
  openModal("modal-user");
}

function editUser(username) {
  const u = App.allUsers.find(x => String(x.username).trim() === String(username).trim());
  if (u) {
    openUserModal(u);
  } else {
    // กรณีค้นหาไม่พบใน state (อาจจะยังไม่ได้โหลดล่าสุด) ให้โหลดใหม่ทั้งหมด
    GS.call("getUsers").then(res => {
      if (res.success) {
        App.allUsers = res.data;
        const u2 = res.data.find(x => String(x.username).trim() === String(username).trim());
        if (u2) openUserModal(u2);
      }
    });
  }
}

  const payload = {
    oldUsername: currentEditUsername,
    username:    document.getElementById("u-username").value.trim(),
    password:    document.getElementById("u-password").value,

function downloadCSV(data, fileName) {
  if (!data || data.length === 0) return;
  const headers = Object.keys(data[0]).join(",");
  const rows = data.map(obj => Object.values(obj).map(v => `"${String(v||"").replace(/"/g, '""')}"`).join(",")).join("\n");
  const blob = new Blob(["\uFEFF" + headers + "\n" + rows], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a"); link.href = url; link.download = fileName; link.click();
}

function handleAdminFileUpload(input) {
  const file = input.files[0];
  if (!file) return;
  
  if (file.size > 25 * 1024 * 1024) { // จำกัด 25 MB
    toast("ขนาดไฟล์ใหญ่เกินไป (จำกัดไม่เกิน 25MB)", "error");
    input.value = "";
    return;
  }
  
  const statusEl = document.getElementById("ed-file-upload-status");
  if (statusEl) {
    statusEl.style.display = "block";
    statusEl.style.color = "var(--blue)";
    statusEl.textContent = `⏳ กำลังอัปโหลดไฟล์: ${file.name} (${formatBytes(file.size)})...`;
  }
  
  const reader = new FileReader();
  reader.onload = async function(e) {
    const base64Data = e.target.result.split(',')[1];
    const fileName = file.name;
    let mimeType = file.type;
    
    // Fallback สำหรับ MIME type ว่าง (กรณีเบราว์เซอร์หรือเครื่องใช้งานไม่รู้จักนามสกุลไฟล์)
    if (!mimeType) {
      const ext = fileName.split('.').pop().toLowerCase();
      const mimeTypes = {
        'xlsx': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
        'xls': 'application/vnd.ms-excel',
        'csv': 'text/csv',
        'pdf': 'application/pdf',
        'doc': 'application/msword',
        'docx': 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
        'png': 'image/png',
        'jpg': 'image/jpeg',
        'jpeg': 'image/jpeg',
        'gif': 'image/gif',
        'zip': 'application/zip',
        'txt': 'text/plain'
      };
      mimeType = mimeTypes[ext] || 'application/octet-stream';
    }
    
    const res = await GS.call("uploadFileToDrive", base64Data, fileName, mimeType);
    if (res.success) {
      if (statusEl) {
        statusEl.style.color = "var(--green)";
        statusEl.textContent = `✅ อัปโหลดสำเร็จ!`;
      }
      const urlInput = document.getElementById("ed-download-url");
      if (urlInput) {
        urlInput.value = res.url;
      }
      toast("อัปโหลดไฟล์เสร็จสิ้นและแนบลิงก์แล้ว", "success");
    } else {
      if (statusEl) {
        statusEl.style.color = "var(--red)";
        statusEl.textContent = `❌ อัปโหลดล้มเหลว: ${res.message}`;
      }
      toast("อัปโหลดล้มเหลว: " + res.message, "error");
    }
  };
  reader.onerror = function() {
    if (statusEl) {
      statusEl.style.color = "var(--red)";
      statusEl.textContent = `❌ เกิดข้อผิดพลาดในการอ่านไฟล์`;
    }
    toast("เกิดข้อผิดพลาดในการอ่านไฟล์", "error");
  };
  reader.readAsDataURL(file);
}

function formatBytes(bytes, decimals = 2) {
  if (bytes === 0) return '0 Bytes';
  const k = 1024;
  const dm = decimals < 0 ? 0 : decimals;
  const sizes = ['Bytes', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
}

function initTheme() {

}

function toggleTheme() {

}
